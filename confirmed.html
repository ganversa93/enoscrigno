<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email confermata — Enoscrigno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background: #6B1839;
    color: #F8F5F1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .card { max-width: 420px; }
  .icon { width: 84px; margin-bottom: 1.75rem; }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 34px;
    margin-bottom: 0.75rem;
  }
  p {
    font-size: 15px;
    line-height: 1.6;
    color: #E6D2B4;
    margin-bottom: 2.25rem;
  }
  a.btn {
    display: inline-block;
    background: #B8892A;
    color: #2A1B0A;
    font-weight: 600;
    font-size: 15px;
    padding: 13px 32px;
    border-radius: 30px;
    text-decoration: none;
  }
  .tagline {
    margin-top: 2.5rem;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: rgba(230, 210, 180, 0.6);
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="assets/enoscrigno-icon-white.png" alt="Enoscrigno" class="icon">
    <h1>Email confermata!</h1>
    <p>Grazie per aver attivato il tuo account.<br>Ti aspettiamo presto su Enoscrigno.</p>
    <a href="index.html" class="btn">Vai al login</a>
    <div class="tagline">Salva · Ricorda · Degusta · Condividi</div>
  </div>
</body>
</html>
